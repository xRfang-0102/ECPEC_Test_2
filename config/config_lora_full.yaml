seed: 42

data:
  dataset: ECF
  data_root: data/ECF

  train_file: train.json
  dev_file: dev.json
  test_file: test.json

  max_utterance_length: 128
  max_dialogue_length: 40
  num_workers: 0


model:
  encoder: pretrained/roberta-base

  # lora_r=0 -> full fine-tuning of the encoder
  lora_r: 0
  lora_alpha: 32
  lora_dropout: 0.1

  input_dim: 768

  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024

  speaker_embedding_dim: 32
  position_embedding_dim: 32

  max_speakers: 20
  max_positions: 64

  auxiliary_hidden: 128

  pair_hidden: 256

  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16
  max_relative_distance: 15

  dropout: 0.1

  # ---- v4: full fine-tune, no A+C ----
  use_event_retrieval: false
  use_locality_prior: false


training:
  batch_size: 16
  epochs: 20

  use_bf16: true

  encoder_lr: 2.0e-5
  module_lr: 0.0001
  weight_decay: 0.01

  warmup_epochs: 2
  f1_smooth_window: 3
  ema_decay: 0.9
  ema_start_epoch: 8

  lambda_emotion: 0.2
  lambda_cause: 0.4

  pair_pos_weight: 2.5

  pair_rank_weight: 0.3
  pair_rank_margin: 0.2
  pair_rank_hard_negative_k: 3

  max_grad_norm: 1.0
  early_stop_patience: 6

  checkpoint_path: checkpoints/base_lora_full_best.pt


evaluation:
  threshold: 0.5
  pair_threshold: 0.66
  row_normalize: false


logging:
  log_dir: logs/base_lora_full
  log_file: logs/base_lora_full/train_lora_full.log
