seed: 42

data:
  dataset: ECF

  feature_root: features/ECF

  train_feature_file: train_roberta.pt
  dev_feature_file: dev_roberta.pt
  test_feature_file: test_roberta.pt

  max_dialogue_length: 40
  num_workers: 4


model:
  pair_decision_mode: adaptive_reference
  input_dim: 768

  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024

  speaker_embedding_dim: 32
  position_embedding_dim: 32

  max_speakers: 20
  max_positions: 64

  auxiliary_hidden: 128

  pair_hidden: 256

  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16
  max_relative_distance: 15

  dropout: 0.1


training:
  batch_size: 4
  epochs: 20

  module_lr: 0.0001
  weight_decay: 0.01

  lambda_emotion: 0.2
  lambda_cause: 0.4

  pair_pos_weight: 2.5

  max_grad_norm: 1.0
  early_stop_patience: 4

  checkpoint_path: checkpoints/adaptive_reference/base_feature_pos2.5_best_adaptive_reference.pt


evaluation:
  pair_threshold: 0.66  # Used only in fixed mode; adaptive uses adjusted logits > 0.


logging:
  log_dir: logs/base_feature_pos2.5_adaptive_reference
  log_file: train_feature_pos2.5_adaptive_reference.log