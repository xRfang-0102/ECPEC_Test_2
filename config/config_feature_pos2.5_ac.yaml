seed: 42

data:
  dataset: ECF

  feature_root: features/ECF

  train_feature_file: train_roberta.pt
  dev_feature_file: dev_roberta.pt
  test_feature_file: test_roberta.pt

  max_dialogue_length: 40
  num_workers: 0


model:
  input_dim: 768

  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024

  speaker_embedding_dim: 32
  position_embedding_dim: 32

  max_speakers: 20
  max_positions: 64

  auxiliary_hidden: 128

  pair_hidden: 256

  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16
  max_relative_distance: 15

  dropout: 0.1

  # ---- A: cross-speaker event memory retrieval ----
  use_event_retrieval: true
  retrieval_key_dim: 64
  use_speaker_thread: true

  # ---- C: locality prior (structural shortcut head) ----
  use_locality_prior: true


training:
  batch_size: 4
  epochs: 20

  module_lr: 0.0001
  weight_decay: 0.01

  warmup_epochs: 2
  f1_smooth_window: 3
  ema_decay: 0.9
  ema_start_epoch: 8

  lambda_emotion: 0.2
  lambda_cause: 0.4

  pair_pos_weight: 2.5

  pair_rank_weight: 0.3
  pair_rank_margin: 0.2
  pair_rank_hard_negative_k: 3

  # ---- A+C objectives ----
  cond_rank_weight: 0.3          # conditional ranking on content logits
  cond_rank_margin: 0.2
  cond_rank_hard_negative_k: 3
  retrieval_loss_weight: 0.1     # retrieval attends to true causes
  locality_prior_reg_weight: 0.001

  max_grad_norm: 1.0
  early_stop_patience: 6

  checkpoint_path: checkpoints/base_feature_pos2.5_ac_best.pt


evaluation:
  threshold: 0.5
  pair_threshold: 0.66
  row_normalize: false


logging:
  log_dir: logs/base_feature_pos2.5_ac
  log_file: train_feature_pos2.5_ac.log
