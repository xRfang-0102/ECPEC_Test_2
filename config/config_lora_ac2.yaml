seed: 42

data:
  dataset: ECF
  data_root: data/ECF

  train_file: train.json
  dev_file: dev.json
  test_file: test.json

  max_utterance_length: 128
  max_dialogue_length: 40
  num_workers: 0


model:
  encoder: pretrained/roberta-base

  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1

  input_dim: 768

  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024

  speaker_embedding_dim: 32
  position_embedding_dim: 32

  max_speakers: 20
  max_positions: 64

  auxiliary_hidden: 128

  pair_hidden: 256

  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16
  max_relative_distance: 15

  dropout: 0.1

  # ---- v3b: A+C on LoRA backbone ----
  use_event_retrieval: true
  retrieval_key_dim: 64
  use_speaker_thread: true
  use_historical_retrieval: true

  use_locality_prior: true


training:
  batch_size: 16
  epochs: 20

  use_bf16: true

  module_lr: 0.0001
  weight_decay: 0.01

  warmup_epochs: 2
  f1_smooth_window: 3
  ema_decay: 0.9
  ema_start_epoch: 8

  lambda_emotion: 0.2
  lambda_cause: 0.4

  pair_pos_weight: 2.5

  pair_rank_weight: 0.3
  pair_rank_margin: 0.2
  pair_rank_hard_negative_k: 3

  # ---- A+C v2 objectives ----
  cond_rank_weight: 0.3
  cond_rank_margin: 0.2
  cond_rank_hard_negative_k: 3
  retrieval_loss_weight: 0.1
  retrieval_local_max_distance: 1
  historical_retrieval_weight: 0.1
  locality_prior_reg_weight: 0.001

  max_grad_norm: 1.0
  early_stop_patience: 6

  checkpoint_path: checkpoints/base_lora_ac2_best.pt


evaluation:
  threshold: 0.5
  pair_threshold: 0.66
  row_normalize: false


logging:
  log_dir: logs/base_lora_ac2
  log_file: logs/base_lora_ac2/train_lora_ac2.log
