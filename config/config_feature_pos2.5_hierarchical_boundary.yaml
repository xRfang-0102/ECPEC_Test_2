seed: 42

data:
  dataset: ECF

  feature_root: features/ECF

  train_feature_file: train_roberta.pt
  dev_feature_file: dev_roberta.pt
  test_feature_file: test_roberta.pt

  max_dialogue_length: 40
  num_workers: 4


model:
  pair_decision_mode: hierarchical_boundary
  hierarchical_center_init: 0.0
  hierarchical_dialogue_hidden: 128
  hierarchical_dialogue_scale: 0.5
  hierarchical_row_hidden: 128
  hierarchical_row_scale: 0.5
  input_dim: 768

  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024

  speaker_embedding_dim: 32
  position_embedding_dim: 32

  max_speakers: 20
  max_positions: 64

  auxiliary_hidden: 128

  pair_hidden: 256

  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16
  max_relative_distance: 15

  dropout: 0.1


training:
  batch_size: 4
  epochs: 20

  module_lr: 0.0001
  weight_decay: 0.01

  lambda_emotion: 0.2
  lambda_cause: 0.4

  pair_pos_weight: 2.5

  null_rank_weight: 0.2
  null_margin: 0.2
  null_hard_negative_k: 3
  hierarchical_dialogue_reg_weight: 0.005
  hierarchical_row_reg_weight: 0.01

  max_grad_norm: 1.0
  early_stop_patience: 100

  checkpoint_path: checkpoints/base_feature_pos2.5_hierarchical_boundary_best.pt


evaluation:
  emotion_threshold: 0.5
  cause_threshold: 0.5
  pair_threshold: 0.66  # Fixed mode only; ignored in hierarchical_boundary mode.


logging:
  log_dir: logs/feature_pos2.5_hierarchical_boundary
  log_file: train_feature_pos2.5_hierarchical_boundary.log