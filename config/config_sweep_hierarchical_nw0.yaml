seed: 42

data:
  dataset: ECF
  feature_root: features/ECF
  train_feature_file: train_roberta.pt
  dev_feature_file: dev_roberta.pt
  test_feature_file: test_roberta.pt
  max_dialogue_length: 40
  num_workers: 0

model:
  pair_decision_mode: hierarchical_boundary
  hierarchical_center_init: 0.0
  hierarchical_dialogue_hidden: 128
  hierarchical_dialogue_scale: 0.5
  hierarchical_row_hidden: 128
  hierarchical_row_scale: 0.5
  input_dim: 768
  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024
  speaker_embedding_dim: 32
  position_embedding_dim: 32
  max_speakers: 20
  max_positions: 64
  auxiliary_hidden: 128
  pair_hidden: 256
  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16
  max_relative_distance: 15
  dropout: 0.1

training:
  batch_size: 4
  checkpoint_path: checkpoints/base_feature_pos2.5_hierarchical_boundary_best.pt

evaluation:
  threshold: 0.5
