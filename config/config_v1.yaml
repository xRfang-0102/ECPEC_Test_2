seed: 42

data:
  dataset: ECF
  data_root: data/ECF

  train_file: train.json
  dev_file: dev.json
  test_file: test.json

  max_utterance_length: 128
  max_dialogue_length: 40
  num_workers: 4

model:
  encoder: pretrained/roberta-base
  max_relative_distance: 15

  dialogue_hidden: 256
  dialogue_layers: 2
  dialogue_heads: 4
  dialogue_ffn: 1024
  auxiliary_hidden: 128

  speaker_embedding_dim: 32
  position_embedding_dim: 32
  distance_embedding_dim: 32
  speaker_relation_embedding_dim: 16

  max_speakers: 20
  max_positions: 64

  dropout: 0.1
  pair_hidden: 256

training:
  batch_size: 4
  epochs: 20

  encoder_lr: 2.0e-5
  module_lr: 1.0e-4

  weight_decay: 0.01

  lambda_emotion: 0.2
  lambda_cause: 0.4

  pair_pos_weight: auto

  early_stop_patience: 4

  checkpoint_path: checkpoints/best_model.pt

evaluation:
  threshold: 0.5

logging:
  log_dir: logs/base_full_balanced
  log_file: train.log